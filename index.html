<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Argentina Móvil</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        #current-title { padding: 15px; background: #1a1a1a; color: #00adb5; font-weight: bold; font-size: 1rem; border-bottom: 1px solid #252525; }
        #channel-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        .channel-item { display: flex; align-items: center; padding: 12px; background: #1a1a1a; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid #252525; }
        .channel-item.active { background: #252525; border-color: #00adb5; }
        .channel-item img { width: 42px; height: 42px; margin-right: 15px; border-radius: 8px; background: #fff; padding: 4px; object-fit: contain; }
    </style>
</head>
<body>

    <div id="player-container"><div id="yt-player"></div></div>
    <div id="current-title">Selecciona un canal</div>
    <ul id="channel-list"></ul>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // IDs largos de canal (empiezan con UC)
        const channels = [
            { name: "TN (Todo Noticias)", ytId: "j6PcyLvpnIRT_2W_mwa9Aw", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e6/Todo_Noticias_2023.png" },
            { name: "C5N", ytId: "O954bZ_wshw", logo: "https://upload.wikimedia.org/wikipedia/commons/c/c5/C5N_logo_2023.png" },
            { name: "América TV", ytId: "UC9mXvHw8Scl_b4K6wXw9W4A", logo: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Am%C3%A9rica_Televisi%C3%B3n_logo_2021.png" },
            { name: "Canal 26", ytId: "UCO6uA5Xg0Gidb_p2u05H5fA", logo: "https://upload.wikimedia.org/wikipedia/commons/f/f3/Canal_26_logo_2021.png" },
            { name: "LN+ (La Nación)", ytId: "UC8m7_V8YShH1086g_v6yS3A", logo: "https://upload.wikimedia.org/wikipedia/commons/d/df/LN%2B_logo_2021.png" }
        ];

        let player = null;

        function onYouTubeIframeAPIReady() {
            const list = document.getElementById('channel-list');
            channels.forEach(ch => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerHTML = `<img src="${ch.logo}"><span>${ch.name}</span>`;
                li.onclick = () => loadChannel(ch, li);
                list.appendChild(li);
            });
        }

        function loadChannel(ch, element) {
            document.getElementById('current-title').innerText = ch.name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            if (player) {
                player.loadVideoByUrl({
                    'mediaContentReference': ch.ytId,
                    'listType': 'live_channel',
                    'list': ch.ytId
                });
            } else {
                player = new YT.Player('yt-player', {
                    playerVars: { 
                        'autoplay': 1, 
                        'playsinline': 1, 
                        'origin': '*',
                        'listType': 'live_channel',
                        'list': ch.ytId
                    }
                });
            }
        }
    </script>
</body>
</html>
